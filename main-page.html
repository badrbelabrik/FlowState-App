<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
        crossorigin="anonymous" referrerpolicy="no-referrer">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body>
    <main class="m-4">
    <!-- Top bar -->
    <div id="top-bar" class="flex justify-between gap-4 my-4">
        <div class="flex gap-2">
            <div class="w-16 h-16 rounded-full bg-[url('images/blog-1.jpg')] bg-cover bg-center"></div>
            <div class="self-center">
                <h2 class="font-bold">Hello BADR !!</h2>
                <span>Be productive today</span>
            </div>
        </div>
        <i class="fa-solid fa-bell self-center text-[#0F2854]"></i>    
    </div>

    <!-- Current task -->
    <div id="current-task" class="flex flex-col justify-center items-center gap-2 my-4">
        <h2 class="self-start font-bold">Current task</h2>
        <div class="flex gap-2 justify-between items-center h-24 w-full bg-[#1C4D8D] rounded-xl px-4">
            <img src="images/jslogo.png" alt="task logo" class="h-16">
            <div>
                <h1 class="font-bold">Learning javascript</h1>
                <p>50 mins</p>
            </div>
            <div class="flex justify-center items-center h-8 w-8 rounded-full bg-[#4988C4]">
                <i class="fa-solid fa-pause text-white"></i>
            </div>
        </div>
    </div>

    <!-- Daily goal -->
    <div id="daily-goal" class="flex flex-col justify-center items-center gap-2 my-4">
        <h1 class="self-start font-bold">Daily goal</h1>
        <div class="flex gap-2 justify-between items-center h-24 w-full bg-[#4988C4] rounded-xl px-4">
            <img src="images/progress.png" alt="" class="h-16">
            <div class="flex flex-col gap-2">
                <h2 class="font-bold">Your daily goals almost done</h2>
                <p class="text-center">5 of 8 completed</p>
            </div>
        </div>
    </div>

    <!-- Todays tasks -->
    <div id="today-tasks" class="flex flex-col justify-center items-center gap-2 my-4">
        <h1 class="self-start font-bold">Today's goals</h1>
        <div class="flex flex-col justify-center items-center gap-4 w-full">
            <!-- tasks list -->
             <!-- task1 -->
            <div  class="flex gap-2 justify-between items-center h-16 w-full bg-[#BDE8F5] rounded-xl px-4">
                <div class="flex flex-col gap-2">
                    <h2 class="font-bold">Reply to emails</h2>
                    <span>25 mins</span>
                </div>
                <div class="flex justify-center items-center h-8 w-8 rounded-full bg-[#4988C4]">
                <i class="fa-solid fa-pause text-white"></i>
            </div>
            </div>
            <!-- task1 end -->
                          <!-- task1 -->
            <div  class="flex gap-2 justify-between items-center h-16 w-full bg-[#BDE8F5] rounded-xl px-4">
                <div class="flex flex-col gap-2">
                    <h2 class="font-bold">Reply to emails</h2>
                    <p>25 mins</p>
                </div>
                <div class="flex justify-center items-center h-8 w-8 rounded-full bg-[#4988C4]">
                <i class="fa-solid fa-pause text-white"></i>
            </div>
            </div>
            <!-- task1 end -->

            <div  class="flex gap-2 justify-between items-center h-16 w-full bg-[#BDE8F5] rounded-xl px-4">
                <div class="flex flex-col gap-2">
                    <h2 class="font-bold">Reply to emails</h2>
                    <p>25 mins</p>
                </div>
                <div class="flex justify-center items-center h-8 w-8 rounded-full bg-[#4988C4]">
                <i class="fa-solid fa-pause text-white"></i>
            </div>
            </div>
            <!-- task1 end -->
        </div>
</div>        
<!-- Modal Overlay -->
<div id="modal"
  class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/40 p-4"
  aria-hidden="true"
>
  <!-- Modal Panel -->
  <div
    class="w-full max-w-md rounded-2xl bg-white shadow-xl"
    role="dialog"
    aria-modal="true"
    aria-labelledby="modal-title"
  >
    <!-- Header -->
    <div class="flex items-center justify-between bg-[#0F2854] px-5 py-3 rounded-t-2xl">
      <h1 id="modal-title" class="font-bold text-2xl text-white">New Task</h1>

      <!-- Close button -->
      <button
        type="button"
        id="close-modal"
        class="h-10 w-10 rounded-full flex items-center justify-center hover:bg-[#1C4D8D]/70"
        aria-label="Close"
      >
        <i class="fa-solid fa-xmark text-xl text-white"></i>
      </button>
    </div>

    <!-- Form -->
    <form id="task-form" class="flex flex-col gap-4 p-5 bg-[#BDE8F5] rounded-b-2xl">
      <div class="flex flex-col gap-1">
        <label for="task-name" class="font-semibold text-sm text-[#0F2854]">Name</label>
        <input
          id="task-name"
          type="text"
          placeholder="Task name"
          class="border border-[#4988C4] rounded-2xl bg-white p-3 w-full focus:ring-2 focus:ring-[#4988C4]"
          required
        />
      </div>

      <div class="grid grid-cols-2 gap-3">
        <div class="flex flex-col gap-1">
          <label for="task-duration" class="font-semibold text-sm text-[#0F2854]">Duration (min)</label>
          <input
            id="task-duration"
            type="number"
            min="1"
            value="25"
            class="border border-[#4988C4] rounded-2xl bg-white p-3 focus:ring-2 focus:ring-[#4988C4]"
            required
          />
        </div>

        <div class="flex flex-col gap-1">
          <label for="task-sessions" class="font-semibold text-sm text-[#0F2854]">Sessions</label>
          <input
            id="task-sessions"
            type="number"
            min="1"
            value="1"
            class="border border-[#4988C4] rounded-2xl bg-white p-3 focus:ring-2 focus:ring-[#4988C4]"
            required
          />
        </div>
      </div>

      <div class="flex flex-col gap-1">
        <label for="task-date" class="font-semibold text-sm text-[#0F2854]">Schedule</label>
        <input
          id="task-date"
          type="date"
          class="border border-[#4988C4] rounded-2xl bg-white p-3 focus:ring-2 focus:ring-[#4988C4]"
        />
      </div>

      <!-- Actions -->
      <div class="flex gap-3 mt-2">
        <button
          type="button"
          id="cancel-task"
          class="flex-1 h-12 rounded-2xl border border-[#4988C4] font-semibold text-[#0F2854] bg-[#BDE8F5] hover:bg-[#4988C4]/30"
        >
          Cancel
        </button>

        <button
          type="submit"
          class="flex-1 h-12 rounded-2xl bg-[#1C4D8D] font-bold text-white hover:bg-[#1C4D8D]/80"
        >
          Add
        </button>
      </div>
    </form>
  </div>
</div>

</main>

</nav>
