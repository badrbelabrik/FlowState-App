<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New task</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
        crossorigin="anonymous" referrerpolicy="no-referrer">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="m-0">
    <main id="modal" class="flex flex-col gap-4 justify-center items-center mt-8 mx-4">
        <h1 class="font-bold text-3xl">New Task</h1>
        <form action="" class="flex flex-col gap-4 self-start mt-8 w-full">
            <label for="">Name :</label>
                <input type="text" placeholder="task name" class="border rounded-2xl bg-orange-300 p-2 w-full" />
            <label for="">Duration :</label>
                <input type="number" placeholder="25" class="border rounded-2xl bg-orange-300 p-2 w-full" />
            <label for="">Sessions :</label>
                <input type="number" placeholder="1" class="border rounded-2xl bg-orange-300 p-2 w-full" />
            <label for="">Schedule :</label>
                <input type="date" placeholder="schedule" class="border rounded-2xl bg-orange-300 p-2 w-full" />
            <button class="self-center flex justify-center items-center bg-orange-400 rounded-xl h-16 w-32 p-4 cursor-pointer">
                <span class="font-bold text-2xl">ADD</span>
            </button>
        </form>
    </main>
</body>

</html>
